name: ParsTech Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: Automatic production deployment is intentionally NOT enabled.
jobs:
  verify:
    name: Typecheck, Tests & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.19-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parstech_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/parstech_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/parstech_test?schema=public
      PRIMARY_ORIGIN: https://parstech.example.com
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client & apply versioned migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Run unit & PostgreSQL integration tests
        run: npm test

      - name: Run Next.js production build
        run: npm run build
