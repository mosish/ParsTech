# ==============================================================================
# ParsTech Phase 1 — Ubuntu Host Nginx Reverse Proxy Configuration
# Install path: /etc/nginx/sites-available/parstech.conf
# Symlink:      ln -s /etc/nginx/sites-available/parstech.conf /etc/nginx/sites-enabled/
#
# Key guarantees:
# 1. Single preferred domain (apex `parstech.example.com`), redirecting `www.`
#    and plain HTTP while preserving full path and query string ($request_uri).
# 2. Prevents redirect loops by passing `X-Forwarded-Proto $scheme` and `Host $host`
#    to the Next.js upstream on `127.0.0.1:3000`.
# 3. Strips untrusted client-supplied proxy headers and sets `X-Real-IP`,
#    `X-Forwarded-For`, and `X-Nginx-Proxy: true` from the host proxy.
# ==============================================================================

# 1. Redirect all HTTP (port 80) traffic to HTTPS preferred apex domain
server {
    listen 80;
    # Enable the IPv6 listen directive below ONLY when IPv6 and AAAA DNS are configured:
    # listen [::]:80;
    server_name parstech.example.com www.parstech.example.com;

    # Allow Certbot ACME HTTP-01 challenge during initial issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://parstech.example.com$request_uri;
    }
}

# 2. Redirect HTTPS www subdomain to HTTPS preferred apex domain (preserving path & query string)
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name www.parstech.example.com;

    ssl_certificate     /etc/letsencrypt/live/parstech.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parstech.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://parstech.example.com$request_uri;
}

# 3. Primary HTTPS Server Block (Preferred Apex Domain -> 127.0.0.1:3000)
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name parstech.example.com;

    ssl_certificate     /etc/letsencrypt/live/parstech.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parstech.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Nginx-Proxy "true";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
